<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Aman Ojha -->
  <meta charset="UTF-8">
  <title>Gate Controller</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 2rem;
      background-color: #f5f5f5;
    }

    h1 {
      color: #333;
    }

    #status {
      font-size: 24px;
      margin: 20px 0;
    }

    button {
      font-size: 18px;
      padding: 10px 30px;
      border: none;
      border-radius: 8px;
      background-color: #007bff;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background-color: #0056b3;
    }
  </style>
</head>

<body>
  <h1>🔐 Gate Controller</h1>
  <div id="status">Loading status...</div>
  <button onclick="toggleGate()">Toggle Gate</button>

  <div id="imageContainer" style="margin-top: 20px; text-align: center; display: none;">
    <img id="gateImage" src="" alt="Gate Image" style="max-width: 100%; max-height: 400px; border-radius: 8px;">
  </div>

  <div style="margin-top: 20px;">
    <a href="error-log.html" style="color: #007bff; text-decoration: none; font-size: 16px;">View Error Log →</a>
  </div>

  <script>
    const dbURL = "https://gatecontrol-a1-1301-default-rtdb.asia-southeast1.firebasedatabase.app/gateOpen.json?auth=aHsFF6jedMN70hR4gKZZKQWxHysegD5ASBooIqsk";

    function updateStatus() {
      // Fetch gate status
      fetch(dbURL)
        .then(res => res.json())
        .then(data => {
          const statusText = data ? "Unlocked" : "Locked";
          document.getElementById("status").textContent = `Gate Status: ${statusText}`;

          // Fetch and display image URL
          fetch("https://gatecontrol-a1-1301-default-rtdb.asia-southeast1.firebasedatabase.app/imageUrl.json?auth=aHsFF6jedMN70hR4gKZZKQWxHysegD5ASBooIqsk")
            .then(res => res.json())
            .then(imageUrl => {
              const imageElement = document.getElementById("gateImage");
              const imageContainer = document.getElementById("imageContainer");
              if (imageUrl) {
                imageElement.src = imageUrl;
                imageContainer.style.display = 'block';
              } else {
                imageContainer.style.display = 'none';
              }
            })
            .catch(err => {
              console.error("Error fetching image URL:", err);
              document.getElementById("imageContainer").style.display = 'none';
            });
        })
        .catch(err => {
          document.getElementById("status").textContent = "Error fetching status.";
          console.error(err);
        });
    }

    function toggleGate() {
      fetch(dbURL)
        .then(res => res.json())
        .then(current => {
          const updated = !current;
          fetch(dbURL, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(updated)
          })
            .then(() => {
              updateStatus();

              // UI-only reset after 6 seconds
              setTimeout(() => {
                document.getElementById("status").textContent = "Gate Status: Locked";
              }, 5000);
            });
        });
    }


    // Load status initially
    updateStatus();
    // Refresh every 5 seconds
    setInterval(updateStatus, 5000);
  </script>
</body>

</html>
